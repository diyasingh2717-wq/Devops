name: Python CI
on:
  push:
    branches:
      - main
jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pytest
        run: pip install pytest
 
     - name: Run Python Program        
        run: |          
            echo -e "85\n78\n92\n88\n75" | python grade_calculator.py
